<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 512" width="760" height="512" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>StreamShelf architecture: screens never touch storage; every call goes through a domain hook</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#8a8f98"/>
    </marker>
  </defs>
  <rect width="760" height="512" fill="#ffffff"/>

  <text x="24" y="28" font-size="15" font-weight="600" fill="#1f2328">Screens never touch storage: every call goes through a domain hook</text>
  <text x="24" y="50" font-size="11.5" fill="#59636e">StreamShelf imports flow one way, top to bottom</text>

  <!-- Routes -->
  <rect x="16" y="68" width="728" height="56" rx="8" fill="#f6f8fa" stroke="#d8dee4"/>
  <text x="28" y="92" font-weight="600" fill="#1f2328">Routes</text>
  <text x="28" y="108" font-size="11.5" fill="#59636e">src/app, Expo Router</text>
  <rect x="174" y="78" width="172" height="36" rx="8" fill="#ffffff" stroke="#8a8f98" stroke-width="1.25"/>
  <text x="260" y="100" text-anchor="middle" fill="#1f2328">index.tsx</text>
  <rect x="364" y="78" width="172" height="36" rx="8" fill="#ffffff" stroke="#8a8f98" stroke-width="1.25"/>
  <text x="450" y="100" text-anchor="middle" fill="#1f2328">details/[id].tsx</text>
  <rect x="554" y="78" width="172" height="36" rx="8" fill="#ffffff" stroke="#8a8f98" stroke-width="1.25"/>
  <text x="640" y="100" text-anchor="middle" fill="#1f2328">my-list.tsx</text>

  <!-- Presentation -->
  <rect x="16" y="144" width="728" height="72" rx="8" fill="#f6f8fa" stroke="#d8dee4"/>
  <text x="28" y="176" font-weight="600" fill="#1f2328">Presentation</text>
  <text x="28" y="192" font-size="11.5" fill="#59636e">screens, components</text>
  <rect x="174" y="152" width="172" height="56" rx="8" fill="#ffffff" stroke="#8a8f98" stroke-width="1.25"/>
  <text x="260" y="176" text-anchor="middle" font-weight="600" fill="#1f2328">HomeScreen</text>
  <text x="260" y="192" text-anchor="middle" font-size="11.5" fill="#59636e">Rail, AsyncStateView</text>
  <rect x="364" y="152" width="172" height="56" rx="8" fill="#ffffff" stroke="#8a8f98" stroke-width="1.25"/>
  <text x="450" y="176" text-anchor="middle" font-weight="600" fill="#1f2328">TitleDetailsScreen</text>
  <text x="450" y="192" text-anchor="middle" font-size="11.5" fill="#59636e">AsyncStateView</text>
  <rect x="554" y="152" width="172" height="56" rx="8" fill="#ffffff" stroke="#8a8f98" stroke-width="1.25"/>
  <text x="640" y="176" text-anchor="middle" font-weight="600" fill="#1f2328">MyListScreen</text>
  <text x="640" y="192" text-anchor="middle" font-size="11.5" fill="#59636e">AsyncStateView</text>

  <!-- Domain -->
  <rect x="16" y="236" width="728" height="56" rx="8" fill="#f6f8fa" stroke="#d8dee4"/>
  <text x="28" y="260" font-weight="600" fill="#1f2328">Domain</text>
  <text x="28" y="276" font-size="11.5" fill="#59636e">custom hooks</text>
  <rect x="174" y="246" width="172" height="36" rx="8" fill="#ddeaff" stroke="#2f6fde" stroke-width="2"/>
  <text x="260" y="268" text-anchor="middle" fill="#1f2328">useHomeScreen</text>
  <rect x="364" y="246" width="172" height="36" rx="8" fill="#ddeaff" stroke="#2f6fde" stroke-width="2"/>
  <text x="450" y="268" text-anchor="middle" fill="#1f2328">useTitleDetails(id)</text>
  <rect x="554" y="246" width="172" height="36" rx="8" fill="#ddeaff" stroke="#2f6fde" stroke-width="2"/>
  <text x="640" y="268" text-anchor="middle" fill="#1f2328">useMyList</text>

  <!-- Data -->
  <rect x="16" y="312" width="728" height="176" rx="8" fill="#f6f8fa" stroke="#d8dee4"/>
  <text x="28" y="340" font-weight="600" fill="#1f2328">Data</text>
  <text x="28" y="356" font-size="11.5" fill="#59636e">sources, storage</text>
  <rect x="174" y="324" width="256" height="88" rx="8" fill="#ffffff" stroke="#8a8f98" stroke-width="1.25"/>
  <text x="302" y="348" text-anchor="middle" font-weight="600" fill="#1f2328">CatalogDataSource</text>
  <text x="302" y="364" text-anchor="middle" font-size="11.5" fill="#59636e">3 rails of local fixtures</text>
  <text x="302" y="380" text-anchor="middle" font-size="11.5" fill="#59636e">250 ms delay, 1-in-4 failure</text>
  <text x="302" y="396" text-anchor="middle" font-size="11.5" fill="#59636e">cache kept only on success</text>
  <rect x="470" y="324" width="256" height="72" rx="8" fill="#ffffff" stroke="#8a8f98" stroke-width="1.25"/>
  <text x="598" y="348" text-anchor="middle" font-weight="600" fill="#1f2328">MyListRepository</text>
  <text x="598" y="364" text-anchor="middle" font-size="11.5" fill="#59636e">one key per title (myList + id)</text>
  <text x="598" y="380" text-anchor="middle" font-size="11.5" fill="#59636e">via StorageProvider interface</text>
  <rect x="470" y="416" width="256" height="56" rx="8" fill="#ffffff" stroke="#8a8f98" stroke-width="1.25"/>
  <text x="598" y="440" text-anchor="middle" font-weight="600" fill="#1f2328">AsyncStorageProvider</text>
  <text x="598" y="456" text-anchor="middle" font-size="11.5" fill="#59636e">wraps AsyncStorage, survives restart</text>

  <!-- Connectors -->
  <g fill="none" stroke="#8a8f98" stroke-width="1.25">
    <path d="M260 114V152" marker-end="url(#arrow)"/>
    <path d="M450 114V152" marker-end="url(#arrow)"/>
    <path d="M640 114V152" marker-end="url(#arrow)"/>
    <path d="M260 208V246" marker-end="url(#arrow)"/>
    <path d="M450 208V246" marker-end="url(#arrow)"/>
    <path d="M640 208V246" marker-end="url(#arrow)"/>
    <path d="M260 282V324" marker-end="url(#arrow)"/>
    <path d="M420 282V324" marker-end="url(#arrow)"/>
    <path d="M490 282V324" marker-end="url(#arrow)"/>
    <path d="M640 282V324" marker-end="url(#arrow)"/>
    <path d="M598 396V416" marker-end="url(#arrow)"/>
  </g>
</svg>
